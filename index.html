  <body>
    <header class="topbar"><div class="brand"><span>QA</span><strong>テスト設計技法トレーニング</strong></div></header>
    <main>
      <p class="eyebrow">QA事業部</p>
      <h1>テスト設計技法トレーニング</h1>
      <p class="lead">学びたいテスト設計技法を選んでください。回答と進捗は、各技法ごとにこのブラウザへ保存されます。</p>
      <nav class="techniques" aria-label="テスト設計技法を選択">
        <a class="technique decision" href="decision-table/"><span>DT</span><div><strong>デシジョンテーブル</strong><small>条件の組み合わせと動作を表で整理する</small></div><b>→</b></a>
        <a class="technique boundary" href="boundary-value-analysis/"><span>BVA</span><div><strong>境界値分析</strong><small>境界の内側・境界・外側を確認する</small></div><b>→</b></a>
        <a class="technique state" href="state-transition-testing/"><span>ST</span><div><strong>状態遷移テスト</strong><small>状態とイベントによる振る舞いを確認する</small></div><b>→</b></a>
        <a class="technique equivalence" href="equivalence-partitioning/"><span>EP</span><div><strong>同値分割法</strong><small>同じ振る舞いの入力グループを選ぶ</small></div><b>→</b></a>
        <a class="technique pairwise" href="pairwise-testing/"><span>PW</span><div><strong>ペアワイズテスト</strong><small>パラメータの組み合わせを効率よく確認する</small></div><b>→</b></a>
      </nav>
      <p class="note">各課題は自己学習用です。ブラウザのデータを消去すると、保存された進捗も削除されます。</p>
    </main>
